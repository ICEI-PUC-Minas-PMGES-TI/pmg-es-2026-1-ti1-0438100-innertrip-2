<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSYCHE – Lista de Consultas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="consultas.css" />
  <link rel="stylesheet" href="../../assets/css/sidebar.css">
</head>
<body>


  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- MAIN -->
  <div class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <h1 class="topbar-title">Lista de Consultas</h1>
      <div class="topbar-right">
        <span class="topbar-greeting" id="topbarGreeting">Bem-vindo!</span>
        <button class="btn-logout" onclick="logoutUser()">Sair</button>
      </div>
    </header>

    <main class="content">

      <!-- CARDS DE RESUMO -->
      <section class="summary-grid">
        <div class="sum-card">
          <p class="sum-label">Total de Consultas</p>
          <p class="sum-value" id="totalConsultas">--</p>
          <p class="sum-sub">Todas as consultas</p>
        </div>
        <div class="sum-card yellow">
          <p class="sum-label">Pendentes</p>
          <p class="sum-value" id="totalPendentes">--</p>
          <p class="sum-sub">Aguardando confirmação</p>
        </div>
        <div class="sum-card">
          <p class="sum-label">Confirmadas</p>
          <p class="sum-value" id="totalConfirmadas">--</p>
          <p class="sum-sub">Agendadas</p>
        </div>
        <div class="sum-card">
          <p class="sum-label">Concluídas</p>
          <p class="sum-value" id="totalConcluidas">--</p>
          <p class="sum-sub">Este mês</p>
        </div>
      </section>

      <!-- FILTROS -->
      <section class="filters-bar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="8.5" cy="8.5" r="5.5"/><path d="M13.5 13.5L18 18"/>
          </svg>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Buscar paciente ou profissional..." oninput="aplicarFiltros()"/>
        </div>
        <select id="filterStatus" class="filter-select" onchange="aplicarFiltros()">
          <option value="">Status: Todos</option>
          <option value="confirmado">Confirmado</option>
          <option value="pendente">Pendente</option>
          <option value="cancelado">Cancelado</option>
          <option value="concluido">Concluído</option>
        </select>
        <select id="filterData" class="filter-select" onchange="aplicarFiltros()">
          <option value="">Data: Todas</option>
          <option value="hoje">Hoje</option>
          <option value="semana">Esta semana</option>
          <option value="mes">Este mês</option>
        </select>
        <select id="filterLocal" class="filter-select" onchange="aplicarFiltros()">
          <option value="">Local: Todos</option>
        </select>
        <button class="btn-primary" onclick="abrirModalNova()">+ Nova Consulta</button>
      </section>

      <!-- TABELA -->
      <section class="table-section">
        <div class="table-wrap">
          <table class="consultas-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Paciente</th>
                <th>Profissional</th>
                <th>Data / Hora</th>
                <th>Local</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="consultasBody">
              <tr><td colspan="7" class="loading-row">Carregando consultas...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <span class="pag-info" id="pagInfo">–</span>
          <div class="pag-btns" id="pagBtns"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Nova Consulta</h2>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Paciente</label>
          <select id="modalPacienteID">
            <option value="">Selecione o paciente</option>
          </select>
        </div>
        <div class="form-group">
          <label>Profissional / Estagiário</label>
          <select id="modalPsicologoID">
            <option value="">Selecione o profissional</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data e Hora</label>
          <input type="datetime-local" id="modalDataHora"/>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="modalStatus">
            <option value="pendente">Pendente</option>
            <option value="confirmado">Confirmado</option>
            <option value="cancelado">Cancelado</option>
            <option value="concluido">Concluído</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Local</label>
          <input type="text" id="modalLocal" placeholder="Local do atendimento"/>
        </div>
        <div class="form-group">
          <label>Modalidade</label>
          <select id="modalModalidade">
            <option value="presencial">Presencial</option>
            <option value="remoto">Remoto</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Avaliação (1-5)</label>
        <input type="number" id="modalAvaliacao" placeholder="Ex: 5" min="1" max="5"/>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <textarea id="modalNotas" rows="3" placeholder="Observações sobre a consulta..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-primary" onclick="salvarConsulta()">Salvar</button>
    </div>
  </div>

<div class="toast" id="toast"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

<script src="../../assets/js/login.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="consultas.js"></script>
</body>
</html>
