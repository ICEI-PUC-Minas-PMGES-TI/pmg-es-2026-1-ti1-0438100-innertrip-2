<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psyche | Cadastro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="left-panel">
      <header class="brand">
        <div class="brand-icon"></div>
        <h1>PSYCHE</h1>
      </header>

      <div class="login-box">
        <h2>BEM-VINDO DE VOLTA!</h2>
        <p>Para continuar conectado conosco,<br> faça login com suas informações pessoais</p>
        <button type="button" id="btnEntrar" class="btn btn-outline">ENTRAR</button>
      </div>
    </section>

    <section class="right-panel">
      <form class="signup-card" id="formCadastro">
        <h2>CRIAR CONTA</h2>
        <p>Use seu e-mail de estudante para se cadastrar:</p>

        <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" required />
        <input type="email" id="email" placeholder="E-mail" autocomplete="email" required />
        <input type="password" id="senha" placeholder="Senha" autocomplete="new-password" required />

        <button type="submit" class="btn btn-dark">CADASTRAR</button>
        <span id="mensagem" class="mensagem"></span>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
