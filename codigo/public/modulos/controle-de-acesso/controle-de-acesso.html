<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login e Controle de Acesso</title>
</head>
<body>

  <h1>Página de Login</h1>

  <label>Usuário:</label>
  <input type="text" id="usuario">

  <br><br>

  <label>Senha:</label>
  <input type="password" id="senha">

  <br><br>

  <button onclick="fazerLogin()">Entrar</button>

  <p id="mensagem"></p>

  <div id="areaAdmin" style="display: none;">
    <h2>Área do Administrador</h2>
    <p>Você tem acesso total ao sistema.</p>
  </div>

  <script>
    function fazerLogin() {
      let usuario = document.getElementById("usuario").value;
      let senha = document.getElementById("senha").value;
      let mensagem = document.getElementById("mensagem");

      if (usuario === "admin" && senha === "123") {
        mensagem.innerHTML = "Login realizado com sucesso!";
        document.getElementById("areaAdmin").style.display = "block";
      } 
      else {
        mensagem.innerHTML = "Usuário ou senha incorretos!";
        document.getElementById("areaAdmin").style.display = "none";
      }
    }
  </script>

</body>
</html>
